<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f7f4" />
    <meta
      name="description"
      content="Odo — a calm, powerful Markdown notes workspace."
    />
    <title>Odo — Notes, naturally</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="window-controls" class="is-hidden" aria-label="Window controls">

    </div>
    <div id="app"></div>
